name: build_test
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.8.1"
      - run: npm ci
      #- run: npm run build
      - run: |
          mkdir '/dist'
          echo "build" > '/dist/version.txt'
      - name: upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: dist/
      - run: npm test
