name: construire_build_deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: "environment"
        required: true
        type: choice
        options:
          - production
          - staging
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.8.1"
      - run: npm ci
      - run: npm run build

      - name: upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ["20", "24"]
        os: ["windows-latest", "ubuntu-latest"]
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: dist/
      - run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: dist/
      - run: echo "deploy"
